name: Publish due threads
# Pings the Vercel publish endpoint on a schedule (see below).

# Drives the scheduler on the Vercel Hobby plan, where native cron can only run
# once/day. This pings /api/cron/publish every 5 minutes so scheduled threads go
# out within ~5 min of their time. GitHub's scheduler is best-effort and may
# delay/skip runs under load — fine for this use. Public repo ⇒ Actions minutes
# are free/unlimited.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # allow a manual "Run workflow" to drain on demand

# If a run is still going when the next fires, skip the new one rather than pile up.
concurrency:
  group: publish-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish drain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 300 -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://thread-analytics-lovat.vercel.app/api/cron/publish)
          echo "HTTP $code"
          cat /tmp/body; echo
          test "$code" = "200"
